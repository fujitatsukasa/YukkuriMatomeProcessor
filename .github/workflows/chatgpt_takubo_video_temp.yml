name: ChatGPT temporary Takubo video collection

on:
  push:
    paths:
      - '.github/workflows/chatgpt_takubo_video_temp.yml'

permissions:
  contents: read

jobs:
  collect-video:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet "yt-dlp[default,curl-cffi]"
      - name: Download one real report clip
        shell: bash
        run: |
          set -u
          mkdir -p out/素材 out/meta
          : > out/meta/取得結果.txt
          urls=(
            'https://www.youtube.com/watch?v=HMl8njzzxh0'
            'https://www.youtube.com/watch?v=kubYhK5iPY4'
            'https://www.youtube.com/watch?v=dfZI8W5ys1c'
          )
          labels=(
            '040_最新報道_PCから卒業証書データ発見_20260825'
            '041_最新報道_PC偽造卒業証書データ_20260825'
            '042_田久保前市長宅_家宅捜索_20260214'
          )
          success=0
          for i in 0 1 2; do
            url="${urls[$i]}"
            label="${labels[$i]}"
            echo "TRY $url" >> out/meta/取得結果.txt
            yt-dlp --no-playlist --impersonate chrome \
              --download-sections '*00:00:00-00:00:15' \
              --force-keyframes-at-cuts \
              -f 'bv*[height<=720]+ba/b[height<=720]' \
              --merge-output-format mp4 \
              --recode-video mp4 \
              -o "out/素材/${label}.%(ext)s" \
              "$url" >> out/meta/取得結果.txt 2>&1 || true
            file="$(find out/素材 -maxdepth 1 -type f -name "${label}*.mp4" -size +100k | head -n 1)"
            if [ -n "$file" ]; then
              mv "$file" "out/素材/${label}_15秒.mp4"
              ffmpeg -y -ss 00:00:05 -i "out/素材/${label}_15秒.mp4" -frames:v 1 -q:v 2 "out/素材/${label}_代表フレーム.jpg" >> out/meta/取得結果.txt 2>&1 || true
              echo "SUCCESS $url" >> out/meta/取得結果.txt
              printf '%s\n' "$url" > out/meta/元動画URL.txt
              success=1
              break
            fi
          done
          echo "success=$success" >> out/meta/取得結果.txt
          find out -type f -printf '%s %p\n' | sort -n >> out/meta/取得結果.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-takubo-video-${{ github.run_id }}
          path: out/**
          retention-days: 2
          compression-level: 0
