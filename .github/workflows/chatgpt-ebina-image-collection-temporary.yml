name: Temporary Ebina actual-media collection

on:
  pull_request:
    branches:
      - main
    paths:
      - 'temporary_ebina_collection/**'
      - '.github/workflows/chatgpt-ebina-image-collection-temporary.yml'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pillow pymupdf yt-dlp
      - name: Verify ffmpeg
        run: |
          ffmpeg -version | head -2
          ffprobe -version | head -2
      - name: Collect actual media
        working-directory: temporary_ebina_collection
        run: python collect.py
      - name: Upload actual media bundle
        uses: actions/upload-artifact@v4
        with:
          name: ebina-actual-media-bundle
          path: temporary_ebina_collection/output/ebina_actual_media_bundle.zip
          compression-level: 0
          retention-days: 3
      - name: Upload metadata and logs
        uses: actions/upload-artifact@v4
        with:
          name: ebina-actual-media-metadata
          path: temporary_ebina_collection/output/metadata/**
          retention-days: 3
