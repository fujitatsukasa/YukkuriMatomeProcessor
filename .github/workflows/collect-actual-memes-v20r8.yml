name: Collect actual meme media V20R8

on:
  push:
    branches: [meme-actual-assets-v20r8]
    paths:
      - 'tools/collect_actual_memes_v20r8.py'
      - '.github/workflows/collect-actual-memes-v20r8.yml'
      - 'ACTUAL_MEME_TRIGGER_V20R8.txt'
  pull_request:
    branches: [main]
    paths:
      - 'tools/collect_actual_memes_v20r8.py'
      - '.github/workflows/collect-actual-memes-v20r8.yml'
      - 'ACTUAL_MEME_TRIGGER_V20R8.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: meme-actual-assets-v20r8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade requests beautifulsoup4 pillow
      - name: Collect actual existing meme media only
        run: |
          rm -rf actual_meme_output actual_meme_artifacts
          python tools/collect_actual_memes_v20r8.py
      - name: Validate output
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import csv, hashlib, io, zipfile
          root=Path('actual_meme_output')
          rows=list(csv.DictReader((root/'00_実在素材全索引.csv').open(encoding='utf-8-sig')))
          assert rows, 'no actual media'
          shas=set(); errors=[]
          banned=('usage_card','practical_template','explainer','説明カード','生成カード','cosplay','contact_sheet')
          for r in rows:
              p=Path(r['ローカルファイル'])
              if not p.exists(): errors.append((str(p),'missing')); continue
              data=p.read_bytes(); sha=hashlib.sha256(data).hexdigest()
              if sha!=r['SHA-256']: errors.append((str(p),'sha mismatch'))
              if sha in shas: errors.append((str(p),'duplicate sha'))
              shas.add(sha)
              try:
                  with Image.open(io.BytesIO(data)) as im: im.verify()
              except Exception as e: errors.append((str(p),str(e)))
              if any(x in p.as_posix().lower() for x in banned): errors.append((str(p),'forbidden generated/related asset'))
          for i in range(1,7):
              zp=Path(f'actual_meme_artifacts/実在ミーム素材のみ_第{i:02d}分冊_V20R8.zip')
              assert zp.exists(), zp
              with zipfile.ZipFile(zp) as z:
                  assert z.testzip() is None
          print({'actual_media':len(rows),'unique_sha':len(shas),'errors':errors[:20]})
          if errors: raise SystemExit(1)
          PY
      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: actual-meme-v20r8-manifest
          path: |
            actual_meme_output/00_実在素材全索引.csv
            actual_meme_output/00_回収結果.txt
            actual_meme_output/00_KYM収集対象URL.txt
            actual_meme_artifacts/全分冊一覧.csv
          retention-days: 7
          compression-level: 0
      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: actual-meme-v20r8-part-01
          path: |
            actual_meme_artifacts/実在ミーム素材のみ_第01分冊_V20R8.zip
            actual_meme_artifacts/実在ミーム素材のみ_第01分冊_V20R8.zip.sha256
          retention-days: 7
          compression-level: 0
      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: actual-meme-v20r8-part-02
          path: |
            actual_meme_artifacts/実在ミーム素材のみ_第02分冊_V20R8.zip
            actual_meme_artifacts/実在ミーム素材のみ_第02分冊_V20R8.zip.sha256
          retention-days: 7
          compression-level: 0
      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with:
          name: actual-meme-v20r8-part-03
          path: |
            actual_meme_artifacts/実在ミーム素材のみ_第03分冊_V20R8.zip
            actual_meme_artifacts/実在ミーム素材のみ_第03分冊_V20R8.zip.sha256
          retention-days: 7
          compression-level: 0
      - name: Upload part 04
        uses: actions/upload-artifact@v4
        with:
          name: actual-meme-v20r8-part-04
          path: |
            actual_meme_artifacts/実在ミーム素材のみ_第04分冊_V20R8.zip
            actual_meme_artifacts/実在ミーム素材のみ_第04分冊_V20R8.zip.sha256
          retention-days: 7
          compression-level: 0
      - name: Upload part 05
        uses: actions/upload-artifact@v4
        with:
          name: actual-meme-v20r8-part-05
          path: |
            actual_meme_artifacts/実在ミーム素材のみ_第05分冊_V20R8.zip
            actual_meme_artifacts/実在ミーム素材のみ_第05分冊_V20R8.zip.sha256
          retention-days: 7
          compression-level: 0
      - name: Upload part 06
        uses: actions/upload-artifact@v4
        with:
          name: actual-meme-v20r8-part-06
          path: |
            actual_meme_artifacts/実在ミーム素材のみ_第06分冊_V20R8.zip
            actual_meme_artifacts/実在ミーム素材のみ_第06分冊_V20R8.zip.sha256
          retention-days: 7
          compression-level: 0
