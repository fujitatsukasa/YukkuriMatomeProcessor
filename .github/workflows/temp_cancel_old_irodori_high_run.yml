name: Temporary cancel superseded Irodori high run

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    if: startsWith(github.head_ref, 'tmp/cancel-old-irodori-high-run-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/30996633276/cancel" || true
