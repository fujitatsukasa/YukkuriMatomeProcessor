name: ChatGPT temporary Takubo latest image collection

on:
  push:
    paths:
      - '.github/workflows/chatgpt_takubo_latest_images_temp.yml'

permissions:
  contents: read

jobs:
  collect-images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download latest report images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/素材 out/meta
          python - <<'PY'
          import csv, hashlib, io
          from pathlib import Path
          import requests
          from PIL import Image

          out=Path('out/素材')
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0'})
          page='https://news.tv-asahi.co.jp/news_society/articles/900197920.html'
          rows=[]
          items=[
            ('040_最新報道_押収PC解析で偽造データ発見_テレ朝_20260826.jpg','https://news.tv-asahi.co.jp/articles_img/900197920_img_ee9419c8cc0553bf482714951779fb7b136206.jpg','押収PC解析・偽造データ発見'),
            ('041_最新報道_卒業勘違い説明_テレ朝_20260826.jpg','https://news.tv-asahi.co.jp/articles_img/900197920_img_bd1caff9413de90356a112d9b7db23fb201791.jpg','本人の卒業勘違い説明'),
            ('042_最新報道_疑惑の卒業証書提示_テレ朝_20260826.jpg','https://news.tv-asahi.co.jp/articles_img/900197920_img_d33cc9e74bdb05c3747746e85f17296d80840.jpg','疑惑の卒業証書提示'),
            ('043_最新報道_第三者作成の無罪主張_テレ朝_20260826.jpg','https://news.tv-asahi.co.jp/articles_img/900197920_img_5e9649f4df3e3a4a927d7e96d2b4e96689763.jpg','第三者作成の主張')]
          for name,url,group in items:
              r=s.get(url,timeout=45); r.raise_for_status(); data=r.content
              im=Image.open(io.BytesIO(data)); im.load(); w,h=im.size
              (out/name).write_bytes(data)
              rows.append([name,page,url,group,'OBSERVED',hashlib.sha256(data).hexdigest(),w,h])
          with open('out/meta/取得台帳.csv','w',encoding='utf-8-sig',newline='') as f:
              cw=csv.writer(f); cw.writerow(['filename','source_page_url','direct_url','group','status','sha256','width','height']); cw.writerows(rows)
          PY
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-takubo-latest-images-${{ github.run_id }}
          path: out/**
          retention-days: 2
          compression-level: 0
