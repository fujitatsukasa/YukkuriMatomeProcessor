name: ChatGPT Video Retry 20260826

on:
  push:
    paths:
      - '.github/workflows/chatgpt_asset_fetch_test_20260826.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg jq
          python -m pip install --upgrade pip
          python -m pip install --upgrade --pre 'yt-dlp[default,curl-cffi]' requests curl_cffi beautifulsoup4
          yt-dlp --version | tee yt_dlp_version.txt
          yt-dlp --list-impersonate-targets | tee impersonation_targets.txt || true

      - name: Try news article native video and Pexels with browser impersonation
        shell: bash
        run: |
          set +e
          mkdir -p retry/article retry/stock retry/logs retry/youtube
          : > retry/logs/yt_dlp_retry.log

          try_page () {
            name="$1"; url="$2"
            echo "===== $name =====" >> retry/logs/yt_dlp_retry.log
            yt-dlp --impersonate chrome --extractor-args 'generic:impersonate' \
              --no-playlist --retries 3 --fragment-retries 3 \
              -f 'bv*[height<=720]+ba/b[height<=720]/best[height<=720]' \
              --download-sections '*0-100' --force-keyframes-at-cuts \
              --merge-output-format mp4 -o "retry/article/${name}.%(ext)s" "$url" \
              >> retry/logs/yt_dlp_retry.log 2>&1
          }
          try_page '301_テレビ朝日_パソコン偽造データ報道' 'https://news.tv-asahi.co.jp/news_society/articles/900197920.html'
          try_page '302_TBS_パソコン偽造データ報道' 'https://newsdig.tbs.co.jp/articles/-/2893791?display=1'
          try_page '303_FNN_パソコン偽造データ報道' 'https://www.fnn.jp/articles/-/1101288'
          try_page '304_LOOK_パソコン偽造データ報道' 'https://look.satv.co.jp/content_news/incident/96078'

          try_stock () {
            name="$1"; url="$2"
            echo "===== $name =====" >> retry/logs/yt_dlp_retry.log
            yt-dlp --impersonate chrome --extractor-args 'generic:impersonate' \
              --no-playlist --retries 3 --fragment-retries 3 \
              -f 'best[height<=720]/best' --merge-output-format mp4 \
              -o "retry/stock/${name}.%(ext)s" "$url" \
              >> retry/logs/yt_dlp_retry.log 2>&1
          }
          try_stock '401_パソコンでファイルを扱う手元_Pexels' 'https://www.pexels.com/video/close-up-of-a-laptop-and-a-desktop-computer-7989695/'
          try_stock '402_プリンターへ用紙を入れる手元_Pexels' 'https://www.pexels.com/video/close-up-on-putting-paper-in-printer-10476939/'
          try_stock '403_USBメモリーを挿す手元_Pexels' 'https://www.pexels.com/video/usb-flash-drive-17741155/'
          try_stock '404_ネット注文をする手元_Pexels' 'https://www.pexels.com/video/a-person-using-a-laptop-while-holding-a-credit-card-6994837/'
          try_stock '405_法律文書を確認する手元_Pexels' 'https://www.pexels.com/video/person-reading-a-papers-8061377/'
          try_stock '406_弁護士が書類を説明する場面_Pexels' 'https://www.pexels.com/video/a-lawyer-talking-to-his-clients-8061607/'
          try_stock '407_複数人で資料を照合する場面_Pexels' 'https://www.pexels.com/video/people-working-on-the-desks-5636968/'
          true

      - name: Retrieve public YouTube videos through current public frontends
        shell: bash
        run: |
          set +e
          python <<'PY'
          from __future__ import annotations
          import json, os, pathlib, re, shutil, subprocess, time
          from urllib.parse import urlparse
          import requests

          root = pathlib.Path('retry')
          outdir = root / 'youtube'
          outdir.mkdir(parents=True, exist_ok=True)
          log = []
          s = requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept':'application/json,text/plain,*/*'})

          videos = [
              ('501_パソコンから偽造データ発見_NNN','zVjQfzZPKqU',95),
              ('502_田久保氏宅の家宅捜索_NNN','0nme1WkB6R8',95),
              ('503_田久保氏在宅起訴_NNN','yKexh43x8Rw',95),
              ('504_田久保氏宅の家宅捜索_SBS','dfZI8W5ys1c',95),
              ('505_田久保氏宅の家宅捜索_テレビ朝日','-CMjqicghx8',95),
              ('506_田久保氏記者会見ノーカット','UBcAjuBHKV8',125),
              ('507_田久保氏百条委員会','-nlIdtE2Zpo',125),
              ('508_百条委員会虚偽陳述報道','2XYALVGYMUU',95),
              ('509_パソコン偽造データ最新短報','uWUHhAaEpBE',95),
          ]
          piped = [
              'https://pipedapi.kavin.rocks',
              'https://pipedapi.tokhmi.xyz',
              'https://pipedapi.moomoo.me',
              'https://pipedapi.syncpundit.io',
              'https://api-piped.mha.fi',
              'https://pipedapi.adminforge.de',
              'https://pipedapi.reallyaweso.me',
          ]
          invidious = [
              'https://inv.nadeko.net',
              'https://invidious.nerdvpn.de',
              'https://yt.chocolatemoo53.com',
          ]

          def quality_num(v):
              q = str(v.get('quality') or v.get('qualityLabel') or '')
              m = re.search(r'(\d+)', q)
              return int(m.group(1)) if m else 0

          def download_url(url, path, referer=None):
              headers={'User-Agent':s.headers['User-Agent']}
              if referer: headers['Referer']=referer
              try:
                  with s.get(url, headers=headers, stream=True, timeout=70, allow_redirects=True) as r:
                      r.raise_for_status()
                      total=0
                      with open(path,'wb') as f:
                          for chunk in r.iter_content(1024*1024):
                              if chunk:
                                  f.write(chunk); total += len(chunk)
                              if total > 400_000_000:
                                  raise RuntimeError('download too large')
                  return total
              except Exception:
                  if pathlib.Path(path).exists(): pathlib.Path(path).unlink()
                  raise

          def trim_copy(src, dst, seconds):
              cmd=['ffmpeg','-y','-hide_banner','-loglevel','error','-i',str(src),'-t',str(seconds),'-map','0:v:0','-map','0:a?','-c:v','libx264','-preset','veryfast','-crf','24','-c:a','aac','-b:a','128k','-movflags','+faststart',str(dst)]
              p=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=900)
              if p.returncode != 0 or not dst.exists() or dst.stat().st_size < 10000:
                  raise RuntimeError('ffmpeg failed: '+p.stdout[-1000:])

          def try_invidious(name, vid, seconds):
              for base in invidious:
                  # direct itag 18 endpoint first
                  for local in ['true','false']:
                      url=f'{base}/latest_version?id={vid}&itag=18&local={local}'
                      tmp=outdir/(name+'_inv_tmp.mp4')
                      try:
                          n=download_url(url,tmp,base)
                          final=outdir/(name+'.mp4')
                          trim_copy(tmp,final,seconds)
                          tmp.unlink(missing_ok=True)
                          log.append({'video':vid,'name':name,'route':'invidious_latest','base':base,'url':url,'status':'ok','bytes':final.stat().st_size})
                          return True
                      except Exception as exc:
                          log.append({'video':vid,'name':name,'route':'invidious_latest','base':base,'url':url,'status':'failed','error':repr(exc)})
                          tmp.unlink(missing_ok=True)
                  try:
                      r=s.get(f'{base}/api/v1/videos/{vid}',timeout=35)
                      r.raise_for_status(); data=r.json()
                      streams=data.get('formatStreams') or []
                      streams=sorted(streams,key=quality_num,reverse=True)
                      streams=[x for x in streams if quality_num(x)<=720 and x.get('url')]
                      if not streams: raise RuntimeError('no muxed streams')
                      st=streams[0]
                      tmp=outdir/(name+'_invjson_tmp.mp4')
                      download_url(st['url'],tmp,base)
                      final=outdir/(name+'.mp4')
                      trim_copy(tmp,final,seconds); tmp.unlink(missing_ok=True)
                      log.append({'video':vid,'name':name,'route':'invidious_json','base':base,'status':'ok','quality':st.get('qualityLabel'),'bytes':final.stat().st_size})
                      return True
                  except Exception as exc:
                      log.append({'video':vid,'name':name,'route':'invidious_json','base':base,'status':'failed','error':repr(exc)})
              return False

          def try_piped(name, vid, seconds):
              for base in piped:
                  try:
                      r=s.get(f'{base}/streams/{vid}',timeout=40)
                      r.raise_for_status(); data=r.json()
                      streams=data.get('videoStreams') or []
                      # Prefer muxed stream. Some instances mark videoOnly=false.
                      mux=[x for x in streams if x.get('url') and not x.get('videoOnly') and quality_num(x)<=720]
                      mux=sorted(mux,key=quality_num,reverse=True)
                      if mux:
                          st=mux[0]
                          tmp=outdir/(name+'_piped_tmp.mp4')
                          download_url(st['url'],tmp,base)
                          final=outdir/(name+'.mp4')
                          trim_copy(tmp,final,seconds); tmp.unlink(missing_ok=True)
                          log.append({'video':vid,'name':name,'route':'piped_muxed','base':base,'status':'ok','quality':st.get('quality'),'bytes':final.stat().st_size})
                          return True
                      vids=[x for x in streams if x.get('url') and quality_num(x)<=720]
                      auds=[x for x in (data.get('audioStreams') or []) if x.get('url')]
                      vids=sorted(vids,key=quality_num,reverse=True)
                      auds=sorted(auds,key=lambda x:int(x.get('bitrate') or 0),reverse=True)
                      if not vids or not auds: raise RuntimeError('no separate streams')
                      vtmp=outdir/(name+'_vtmp.bin'); atmp=outdir/(name+'_atmp.bin'); muxed=outdir/(name+'_muxed.mp4')
                      download_url(vids[0]['url'],vtmp,base); download_url(auds[0]['url'],atmp,base)
                      cmd=['ffmpeg','-y','-hide_banner','-loglevel','error','-i',str(vtmp),'-i',str(atmp),'-t',str(seconds),'-map','0:v:0','-map','1:a:0','-c:v','libx264','-preset','veryfast','-crf','24','-c:a','aac','-b:a','128k','-movflags','+faststart',str(muxed)]
                      p=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=900)
                      vtmp.unlink(missing_ok=True); atmp.unlink(missing_ok=True)
                      if p.returncode != 0 or not muxed.exists() or muxed.stat().st_size<10000: raise RuntimeError('mux failed '+p.stdout[-500:])
                      final=outdir/(name+'.mp4'); muxed.replace(final)
                      log.append({'video':vid,'name':name,'route':'piped_separate','base':base,'status':'ok','quality':vids[0].get('quality'),'bytes':final.stat().st_size})
                      return True
                  except Exception as exc:
                      log.append({'video':vid,'name':name,'route':'piped','base':base,'status':'failed','error':repr(exc)})
                      for p in outdir.glob(name+'_*tmp*'): p.unlink(missing_ok=True)
              return False

          for name,vid,seconds in videos:
              final=outdir/(name+'.mp4')
              if final.exists() and final.stat().st_size>10000: continue
              ok=try_invidious(name,vid,seconds)
              if not ok: ok=try_piped(name,vid,seconds)
              log.append({'video':vid,'name':name,'final_status':'ok' if ok else 'inaccessible'})

          (root/'logs'/'frontend_download.json').write_text(json.dumps(log,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          true

      - name: Validate and inventory recovered video
        shell: bash
        run: |
          set +e
          python <<'PY'
          import hashlib,json,mimetypes,pathlib,subprocess
          root=pathlib.Path('retry')
          inv=[]
          for p in sorted(root.rglob('*')):
              if not p.is_file(): continue
              rec={'path':str(p.relative_to(root)),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'mime':mimetypes.guess_type(p.name)[0] or ''}
              if p.suffix.lower() in ['.mp4','.webm','.mov','.mkv']:
                  q=subprocess.run(['ffprobe','-v','error','-show_entries','format=duration:stream=width,height,codec_name','-of','json',str(p)],stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True)
                  try: rec['ffprobe']=json.loads(q.stdout)
                  except: rec['ffprobe_error']=q.stderr[-1000:]
                  d=subprocess.run(['ffmpeg','-v','error','-i',str(p),'-f','null','-'],stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True)
                  rec['decode_ok']=d.returncode==0
                  rec['decode_error']=d.stderr[-500:] if d.returncode else ''
              inv.append(rec)
          (root/'retry_inventory.json').write_text(json.dumps(inv,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'files':len(inv),'videos':sum(1 for x in inv if x['path'].lower().endswith(('.mp4','.webm','.mov','.mkv')))},ensure_ascii=False))
          PY
          find retry -maxdepth 3 -type f -printf '%p %s bytes\n' | sort

      - uses: actions/upload-artifact@v4
        with:
          name: recovered-video-assets-20260826
          path: retry/
          retention-days: 1
          compression-level: 6
          if-no-files-found: error
