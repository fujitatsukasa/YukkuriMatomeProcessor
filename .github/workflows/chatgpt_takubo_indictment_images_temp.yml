name: ChatGPT temporary Takubo indictment image collection

on:
  push:
    paths:
      - '.github/workflows/chatgpt_takubo_indictment_images_temp.yml'

permissions:
  contents: read

jobs:
  collect-images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download indictment report images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/素材 out/meta
          python - <<'PY'
          import csv, hashlib, imghdr
          from pathlib import Path
          from urllib.request import Request, urlopen
          out=Path('out/素材')
          items=[
            ('044_在宅起訴_卒業証書偽造_FNN_20260330.jpg','https://www.fnn.jp/articles/-/1022683','https://fnn.ismcdn.jp/mwimgs/e/2/1200/img_e257ef934fa23889383b30a4771d060021422.jpg','在宅起訴'),
            ('045_学長名ニセ印鑑をネット発注_TBS_20260331.jpg','https://newsdig.tbs.co.jp/articles/-/2567468','https://newsdig.ismcdn.jp/mwimgs/7/4/-/img_74c9863ad497bc01142f6356a7aaeadc348374.jpg','印鑑発注')]
          rows=[]
          for name,page,url,group in items:
              req=Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urlopen(req,timeout=45) as r: data=r.read()
              if len(data)<20000 or imghdr.what(None,data) not in {'jpeg','png','webp'}:
                  raise RuntimeError(f'invalid image: {url} {len(data)}')
              (out/name).write_bytes(data)
              rows.append([name,page,url,group,'OBSERVED',hashlib.sha256(data).hexdigest(),len(data)])
          with open('out/meta/取得台帳.csv','w',encoding='utf-8-sig',newline='') as f:
              w=csv.writer(f); w.writerow(['filename','source_page_url','direct_url','group','status','sha256','bytes']); w.writerows(rows)
          PY
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-takubo-indictment-images-${{ github.run_id }}
          path: out/**
          retention-days: 2
          compression-level: 0
