name: ChatGPT Video Quick 20260826

on:
  push:
    paths:
      - '.github/workflows/chatgpt_video_quick_20260826.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          python -m pip install --upgrade --pre 'yt-dlp[default,curl-cffi]'
      - name: Fetch quick video routes
        shell: bash
        run: |
          set +e
          mkdir -p quick/article quick/stock quick/logs
          : > quick/logs/quick.log
          get () {
            dir="$1"; name="$2"; url="$3"
            echo "===== $name =====" >> quick/logs/quick.log
            yt-dlp --impersonate chrome --extractor-args 'generic:impersonate' --no-playlist --retries 2 --fragment-retries 2 \
              -f 'bv*[height<=720]+ba/b[height<=720]/best[height<=720]' --merge-output-format mp4 \
              --download-sections '*0-100' --force-keyframes-at-cuts \
              -o "quick/${dir}/${name}.%(ext)s" "$url" >> quick/logs/quick.log 2>&1
          }
          get article '301_テレビ朝日_パソコン偽造データ報道' 'https://news.tv-asahi.co.jp/news_society/articles/900197920.html'
          get article '302_TBS_パソコン偽造データ報道' 'https://newsdig.tbs.co.jp/articles/-/2893791?display=1'
          get article '303_FNN_パソコン偽造データ報道' 'https://www.fnn.jp/articles/-/1101288'
          get article '304_LOOK_パソコン偽造データ報道' 'https://look.satv.co.jp/content_news/incident/96078'
          get stock '401_パソコンでファイルを扱う手元_Pexels' 'https://www.pexels.com/video/close-up-of-a-laptop-and-a-desktop-computer-7989695/'
          get stock '402_プリンターへ用紙を入れる手元_Pexels' 'https://www.pexels.com/video/close-up-on-putting-paper-in-printer-10476939/'
          get stock '403_USBメモリーを挿す手元_Pexels' 'https://www.pexels.com/video/usb-flash-drive-17741155/'
          get stock '404_ネット注文をする手元_Pexels' 'https://www.pexels.com/video/a-person-using-a-laptop-while-holding-a-credit-card-6994837/'
          get stock '405_法律文書を確認する手元_Pexels' 'https://www.pexels.com/video/person-reading-a-papers-8061377/'
          get stock '406_弁護士が書類を説明する場面_Pexels' 'https://www.pexels.com/video/a-lawyer-talking-to-his-clients-8061607/'
          get stock '407_複数人で資料を照合する場面_Pexels' 'https://www.pexels.com/video/people-working-on-the-desks-5636968/'
          true
      - name: Validate
        run: |
          set +e
          for f in quick/article/* quick/stock/*; do
            [ -f "$f" ] || continue
            ffmpeg -v error -i "$f" -f null - || rm -f "$f"
          done
          find quick -type f -printf '%p %s bytes\n' | sort
      - uses: actions/upload-artifact@v4
        with:
          name: quick-video-assets-20260826
          path: quick/
          retention-days: 1
          compression-level: 6
          if-no-files-found: error
