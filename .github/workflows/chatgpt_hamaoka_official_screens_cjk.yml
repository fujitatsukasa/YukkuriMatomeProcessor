name: ChatGPT Hamaoka official captures CJK

on:
  push:
    branches:
      - chatgpt-hamaoka-public-20260828
    paths:
      - '.github/workflows/chatgpt_hamaoka_official_screens_cjk.yml'

permissions:
  contents: read

jobs:
  capture-cjk:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f -v >/dev/null
      - name: Capture official source pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p official_screens_cjk
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          capture(){
            local name="$1" url="$2"
            "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --lang=ja-JP --window-size=1920,1080 --virtual-time-budget=12000 --screenshot="official_screens_cjk/${name}.png" "$url" || true
          }
          capture '中部電力公式_不適切事案発表_20260827' 'https://www.chuden.co.jp/publicity/press/1218246_3273.html'
          capture '中部電力公式_経済産業大臣報告徴収_20260827' 'https://www.chuden.co.jp/publicity/press/1218247_3273.html'
          capture '中部電力公式_NuRO指示受領_20260827' 'https://www.chuden.co.jp/publicity/press/1218248_3273.html'
          capture 'NuRO公式_廃炉推進業務の役割' 'https://www.nuro.or.jp/decommissioning/role.html'
          capture '中部電力公式_浜岡1号機2号機廃止措置進捗' 'https://www.chuden.co.jp/energy/nuclear/hamaoka/hama_haishi/joukyou/'
          file official_screens_cjk/*
      - uses: actions/upload-artifact@v4
        with:
          name: hamaoka-official-source-screens-cjk
          path: official_screens_cjk/
          if-no-files-found: error
          retention-days: 1
