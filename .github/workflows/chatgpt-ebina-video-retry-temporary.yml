name: Temporary Ebina video retry

on:
  pull_request:
    branches:
      - main
    paths:
      - 'temporary_ebina_video_retry/**'
      - '.github/workflows/chatgpt-ebina-video-retry-temporary.yml'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests "yt-dlp[default]"
      - name: Collect actual video clips
        working-directory: temporary_ebina_video_retry
        run: python retry.py
      - name: Upload video retry bundle
        uses: actions/upload-artifact@v4
        with:
          name: ebina-video-retry-bundle
          path: temporary_ebina_video_retry/output/ebina_video_retry_bundle.zip
          compression-level: 0
          retention-days: 3
